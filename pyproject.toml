[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "au-ree-placer-pipeline"
version = "0.1.0"
description = "Config-driven geoscience pipeline for placer Au+REE assessment using NURE, MRDS, and WGS datasets"
requires-python = ">=3.10"
dependencies = [
    "fiona>=1.9",
    "geopandas>=1.0.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyproj>=3.6.1",
    "pysheds>=0.5",
    "rasterio>=1.4.3",
    "scikit-learn==1.6.1",
    "scipy>=1.13.1",
    "shapely>=2.0.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.11"]
tracking = ["mlflow>=2.10"]
gee = ["earthengine-api>=1.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["api", "pipeline", "scripts"]
include = [
    "api/ops.py",
    "pipeline/mlflow_tracking.py",
    "scripts/smoke_health.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017"]

[tool.mypy]
python_version = "3.11"
files = ["api"]
ignore_missing_imports = true
warn_unused_ignores = true
