# Rand district dry placers — Randsburg, Goler Gulch, Red Rock Canyon,
# El Paso Mountains (Kern / San Bernardino). Dry-wash country; trap walks
# still run on MERIT channels (ee_trace); water_regime flags dry reaches.
#
#   python -m pipeline.fetch_region --config configs/rand_district/config.yaml
#   python -m pipeline.county_rank  --config configs/rand_district/config.yaml

study_area:
  name: "Rand district dry placers"
  short: "ca_rand"
  state: CA
  bbox:
    lon_min: -118.10
    lon_max: -117.40
    lat_min:  35.10
    lat_max:  35.60
  map_padding: 0.08
  crs: "EPSG:4326"

outputs_dir: "rand_district/outputs"

gee:
  project: placer-picker-511303

data:
  nure_csv:        "data/nure/nure_ca_rand_sediment.csv"
  mrds_geojson:    "data/mrds/mrds_ca_rand.geojson"
  sgmc_state: CA
  dem_tif: data/dem/ca_rand_30m.tif
  hobby_reports_csv: null
  padus_geojson: "data/padus/padus_ca_rand.geojson"
  mlrs_geojson: "data/mlrs/mlrs_claims_ca_rand.geojson"
  aiannh_geojson: "data/aiannh/aiannh_ca_rand.geojson"

task11:
  land_access: true
  claim_buffer_m: 50

county_rank:
  seed_cell_km: 3.0
  max_seeds: 250
  up_km: 0.5
  down_km: 4.0
  snap_m: 800
  min_snap_km2: 0.3
  pans_per_walk: 2
  chem_radius_km: 3.0
  chem_elements: [Au, As]
  closed_claim_radius_m: 300
  gee_sample: true
  ee_trace: true

sites: []
