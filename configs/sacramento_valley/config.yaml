# Sacramento Valley — Napa, Yolo, Colusa, Sutter, Solano, and western Tehama.
# Fills California counties the earlier district boxes did not walk.
#
#   python -m pipeline.fetch_region --config configs/sacramento_valley/config.yaml --skip-dem
#   python -m pipeline.county_rank  --config configs/sacramento_valley/config.yaml

study_area:
  name: "Sacramento Valley"
  short: "ca_sacramento_valley"
  state: CA
  bbox:
    lon_min: -122.90
    lon_max: -121.25
    lat_min:  38.00
    lat_max:  40.00
  map_padding: 0.08
  crs: "EPSG:4326"

outputs_dir: "sacramento_valley/outputs"

gee:
  project: placer-picker-511303

data:
  nure_csv:        "data/nure/nure_ca_sacramento_valley_sediment.csv"
  mrds_geojson:    "data/mrds/mrds_ca_sacramento_valley.geojson"
  sgmc_state: CA
  dem_tif: data/dem/ca_sacramento_valley_30m.tif
  hobby_reports_csv: null
  padus_geojson: "data/padus/padus_ca_sacramento_valley.geojson"
  mlrs_geojson: "data/mlrs/mlrs_claims_ca_sacramento_valley.geojson"
  aiannh_geojson: "data/aiannh/aiannh_ca_sacramento_valley.geojson"

task11:
  land_access: true
  claim_buffer_m: 50

county_rank:
  seed_cell_km: 4.0
  max_seeds: 300
  up_km: 0.5
  down_km: 4.0
  snap_m: 600
  min_snap_km2: 1.0
  pans_per_walk: 2
  chem_radius_km: 3.0
  chem_elements: [Au, As]
  closed_claim_radius_m: 300
  gee_sample: true
  ee_trace: true

sites: []
