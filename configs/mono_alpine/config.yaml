# Mono and Alpine — Alpine and Mono, east of the existing Sierra and Mother Lode boxes.
# Fills California counties the earlier district boxes did not walk.
#
#   python -m pipeline.fetch_region --config configs/mono_alpine/config.yaml --skip-dem
#   python -m pipeline.county_rank  --config configs/mono_alpine/config.yaml

study_area:
  name: "Mono and Alpine"
  short: "ca_mono_alpine"
  state: CA
  bbox:
    lon_min: -120.15
    lon_max: -117.75
    lat_min:  37.40
    lat_max:  38.98
  map_padding: 0.08
  crs: "EPSG:4326"

outputs_dir: "mono_alpine/outputs"

gee:
  project: placer-picker-511303

data:
  nure_csv:        "data/nure/nure_ca_mono_alpine_sediment.csv"
  mrds_geojson:    "data/mrds/mrds_ca_mono_alpine.geojson"
  sgmc_state: CA
  dem_tif: data/dem/ca_mono_alpine_30m.tif
  hobby_reports_csv: null
  padus_geojson: "data/padus/padus_ca_mono_alpine.geojson"
  mlrs_geojson: "data/mlrs/mlrs_claims_ca_mono_alpine.geojson"
  aiannh_geojson: "data/aiannh/aiannh_ca_mono_alpine.geojson"

task11:
  land_access: true
  claim_buffer_m: 50

county_rank:
  seed_cell_km: 4.0
  max_seeds: 300
  up_km: 0.5
  down_km: 4.0
  snap_m: 600
  min_snap_km2: 1.0
  pans_per_walk: 2
  chem_radius_km: 3.0
  chem_elements: [Au, As]
  closed_claim_radius_m: 300
  gee_sample: true
  ee_trace: true

sites: []
