# Piute Mountains / Tehachapi / Caliente Creek — southern Kern County
# (and a sliver of Los Angeles County in the Tehachapis).
#
#   python -m pipeline.fetch_region --config configs/piute_tehachapi/config.yaml
#   python -m pipeline.county_rank  --config configs/piute_tehachapi/config.yaml

study_area:
  name: "Piute Tehachapi placers"
  short: "ca_piute_tehachapi"
  state: CA
  bbox:
    lon_min: -118.75
    lon_max: -118.15
    lat_min:  34.90
    lat_max:  35.55
  map_padding: 0.08
  crs: "EPSG:4326"

outputs_dir: "piute_tehachapi/outputs"

gee:
  project: placer-picker-511303

data:
  nure_csv:        "data/nure/nure_ca_piute_tehachapi_sediment.csv"
  mrds_geojson:    "data/mrds/mrds_ca_piute_tehachapi.geojson"
  sgmc_state: CA
  dem_tif: data/dem/ca_piute_tehachapi_30m.tif
  hobby_reports_csv: null
  padus_geojson: "data/padus/padus_ca_piute_tehachapi.geojson"
  mlrs_geojson: "data/mlrs/mlrs_claims_ca_piute_tehachapi.geojson"
  aiannh_geojson: "data/aiannh/aiannh_ca_piute_tehachapi.geojson"

task11:
  land_access: true
  claim_buffer_m: 50

county_rank:
  seed_cell_km: 3.0
  max_seeds: 250
  up_km: 0.5
  down_km: 4.0
  snap_m: 600
  min_snap_km2: 0.5
  pans_per_walk: 2
  chem_radius_km: 3.0
  chem_elements: [Au, As]
  closed_claim_radius_m: 300
  gee_sample: true
  ee_trace: true

sites: []
