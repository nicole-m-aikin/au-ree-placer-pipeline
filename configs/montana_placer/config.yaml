# Southwest Montana gold gulches — frozen-forest transfer box.
# Boulder Batholith / Elkhorn / Confederate Gulch / Alder Gulch / Montana Bar.
# Libby is a different belt and is not in this box.
# Task 12 scores the NE WA forest. Task 11 builds the walk list.
# Tasks 1–10 stay off until sites have real public depths.

