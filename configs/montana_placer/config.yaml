  name: "Montana SW gold gulches"
  short: "mt_placer"
  bbox:
    lon_min: -112.85
    lon_max: -111.15
    lat_min:  45.20
    lat_max:  46.80
  map_padding: 0.08
  wgs_bbox:
    lon_min: -112.85
    lon_max: -111.15
    lat_min:  45.20
