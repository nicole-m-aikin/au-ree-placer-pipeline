# San Gabriel River / Placerita Canyon — Los Angeles County recreational
# panning belt (Placerita Canyon SHP, East Fork San Gabriel).
#
#   python -m pipeline.fetch_region --config configs/san_gabriel/config.yaml
#   python -m pipeline.county_rank  --config configs/san_gabriel/config.yaml

study_area:
  name: "San Gabriel placers"
  short: "ca_san_gabriel"
  state: CA
  bbox:
    lon_min: -118.60
    lon_max: -117.60
    lat_min:  34.15
    lat_max:  34.50
  map_padding: 0.08
  crs: "EPSG:4326"

outputs_dir: "san_gabriel/outputs"

gee:
  project: placer-picker-511303

data:
  nure_csv:        "data/nure/nure_ca_san_gabriel_sediment.csv"
  mrds_geojson:    "data/mrds/mrds_ca_san_gabriel.geojson"
  sgmc_state: CA
  dem_tif: data/dem/ca_san_gabriel_30m.tif
  hobby_reports_csv: null
  padus_geojson: "data/padus/padus_ca_san_gabriel.geojson"
  mlrs_geojson: "data/mlrs/mlrs_claims_ca_san_gabriel.geojson"
  aiannh_geojson: "data/aiannh/aiannh_ca_san_gabriel.geojson"

task11:
  land_access: true
  claim_buffer_m: 50

county_rank:
  seed_cell_km: 3.0
  max_seeds: 200
  up_km: 0.5
  down_km: 4.0
  snap_m: 600
  min_snap_km2: 1.0
  pans_per_walk: 2
  chem_radius_km: 3.0
  chem_elements: [Au, As]
  closed_claim_radius_m: 300
  gee_sample: true
  ee_trace: true

sites: []
