# ============================================================
# Au+REE Pipeline — NE Washington Study Area Configuration
# ============================================================
# All paths are relative to the repo root.
# Run:  python pipeline/run_pipeline.py --config configs/ne_washington/config.yaml

study_area:
  name: "NE Washington"
  short: "ne_wa"
  bbox:
    lon_min: -120.0
    lon_max: -117.0
    lat_min: 47.5
    lat_max: 49.1
  map_padding: 0.08   # degrees of padding added to bbox for all map panels
  # Tighter bbox used for WGS site filtering
  wgs_bbox:
    lon_min: -120.0
    lon_max: -117.5
    lat_min: 47.5
    lat_max: 49.1
  crs: "EPSG:4326"

outputs_dir: "ne_wa_ree/outputs"

# ── Data file locations ───────────────────────────────────────────────────────
data:
  nure_csv: "data/nure/nure_ne_wa_sediment.csv"
  mrds_geojson: "ne_wa_ree/data/mrds/mrds_ne_wa.geojson"
  geology_geojson: null        # ne_wa_ree/data/geologic/wa_geology.geojson (optional)
  aeromagnetic_tif: null       # ne_wa_ree/data/aeromagnetic/wa_mag_anomaly.tif (optional)
  # NURE / USGS aerial gamma-ray (optional). Same family as stream-sediment NURE
  # but a different survey: aircraft-measured K %, eTh ppm, eU ppm.
  # Quantitative grids: NAMrad_{K,Th,U}.zip on https://mrdata.usgs.gov/radiometric/
  # (NArad_*_geog83.tif are RGB previews). Fetch + clip:
  #   python -m pipeline.fetch_radiometric --config configs/ne_washington/config.yaml
  radiometric_k_tif: "ne_wa_ree/data/radiometric/ne_wa_K.tif"
  radiometric_eth_tif: "ne_wa_ree/data/radiometric/ne_wa_eTh.tif"
  radiometric_eu_tif: "ne_wa_ree/data/radiometric/ne_wa_eU.tif"
  dem_tif: "ne_wa_ree/data/dem/ne_wa_dem_30m.tif"  # Copernicus GLO-30, 8 tiles mosaicked, covers lon -120→-116 / lat 47→49
  wgs_excel: data/wgs_ofr2026/ger_ofr2026-02_data_supplement.xlsx
  # Cited recreational gazetteer + opt-in form rows. Not a scrape. Not labels.
  hobby_reports_csv: "data/hobby_reports/hobby_reports_ne_wa.csv"

# ── NURE validation (pipeline/data_validation.py; CIM 2018 §2.1.1.1) ─────────
# Validated path only. The frozen doorbell keeps utils.load_nure for
# reproducibility. 7.5′ samples (548 at one point) and non-stream media are
# excluded; censored values are kept at half-MDL with their MDL.
# "surface" (Grosz, USGS; medium not further documented) admitted on review
# 27 Sep 2026. Sensitivity scenario keeps the stream-only result on record.
nure_validation:
  max_coord_prec: "0.01 degree"
  sample_sources: ["stream/river", "surface"]
  max_censored_frac: 0.5
  sensitivity_sample_sources: ["stream/river"]

# ── MRDS commodity filter ─────────────────────────────────────────────────────
mrds_commodities: ["placer gold", "gold", "REE", "monazite", "magnetite"]

# ── ML targeting (Task 9) ─────────────────────────────────────────────────────
# Published result of record: label_method: proximity
#   0.15° (~15 km) around MRDS sites after commodity_filter, plus the 200 m
#   elevation filter when a DEM is present. This is the screening question:
#   "does this chemistry look like ground near known gold deposits?"
# catchment is implemented but not the published model. It uses cfg.sites
# (~12 pour points), not the full MRDS gold inventory. Do not pass ~1,600
# MRDS records into delineate_catchments.
# mrds_commodity_filter applies to proximity labeling and feature-set selection:
#   'placer_gold' — Gold target_commodity only (1623 NE WA sites)
#   'ree'         — Rare Earth Elements target_commodity (7 sites; sparse)
#   'cu_mo'       — sites with CU or MO in code_list (~300+ sites)
#   'all'         — no filter, blended model (legacy behaviour)
holdout:
  lon_cut: -118.50  # Kettle — train west, test east; do not rewrite the joblib
ml:
  label_method: "proximity"    # published default; "catchment" is experimental
  mrds_proximity_deg: 0.15
  mrds_commodity_filter: "placer_gold"
  mrds_elev_diff_m: 200
  catchment_snap_percentile: 99.5   # only used when label_method=catchment
  catchment_snap_max_m: 5000
  anomaly_top_pct: 0.10

# ── Mine sites (12 NE WA priority placer sites) ──────────────────────────────
# Each site carries all per-site parameters needed by tasks 1, 4, 5.
# Provenance (CIM 2018 legacy-data check): the former mrds_id values
# M004321–M004332 did not exist in the MRDS extract and were removed. Every
# site was checked against ne_wa_ree/data/mrds/mrds_ne_wa.geojson with
#   python -m pipeline.site_provenance --config configs/ne_washington/config.yaml
# (-> ne_wa_ree/outputs/tables/site_verification.csv). mrds_match classes:
#   matched_name_near — name match ≤5 km; coordinates moved to the MRDS record
#   matched_name_far  — name match >5 km; config coordinate kept, candidate
